<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进阶象棋</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- 按依赖顺序加载：常量 -> 绘制 -> 棋子 -> 状态机 -> 输入 -> 入口
       （defer 保证按此顺序执行，且在 DOM 就绪后才运行） -->
  <script src="js/constants.js" defer></script>
  <script src="js/rules.js" defer></script>
  <script src="js/board.js" defer></script>
  <script src="js/pieces.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/input.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="app">
    <h1 class="app__title">进阶象棋</h1>

    <!-- 状态栏：左侧回合提示，右侧投降按钮（文案与可用状态由 js/game.js 刷新） -->
    <div class="status-bar">
      <span id="status-turn" class="status-bar__turn">轮到红方走</span>
      <button id="status-surrender" class="status-bar__btn" type="button">红方投降</button>
    </div>

    <div class="board-wrap">
      <canvas id="board" class="board"></canvas>

      <!-- 结束弹窗：默认带 hidden 类，分出胜负后由 js/game.js 显示 -->
      <div id="game-over" class="overlay hidden">
        <div class="overlay__box">
          <h2 id="game-over-title" class="overlay__title">游戏结束</h2>
          <button id="game-over-restart" class="overlay__btn" type="button">再来一局</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
